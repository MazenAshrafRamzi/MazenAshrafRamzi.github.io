<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
<title>Voices of Stone</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0a06; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #0d0a06; }
  #loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; color: #e9d8a6;
    background: radial-gradient(ellipse at 50% 40%, #2a1e0c 0%, #0d0a06 70%); transition: opacity .5s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader h1 { margin: 0; font-weight: 400; letter-spacing: .18em; font-size: clamp(26px, 5vw, 52px); }
  #loader p { margin: 0; color: #b59a5f; font-size: 15px; letter-spacing: .08em; }
  .sun { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffe29a, #d4a237 60%, #8a5d14);
    box-shadow: 0 0 40px #d4a23766; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 70px #d4a237aa; } }
  #bar { width: min(380px, 70vw); height: 4px; margin: 6px auto 0; background: #3a2c14; border-radius: 2px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, #b07d22, #ffe29a); transition: width .2s; }
  #err { color: #ff9b85; max-width: 80vw; font-size: 14px; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader">
  <div class="sun"></div>
  <h1>VOICES OF STONE</h1>
  <p>An interactive museum of Ancient Egypt</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="pct">Loading 0%</p>
  <p id="err" hidden></p>
</div>
<script src="Build/WebGL.loader.js"></script>
<script>
  var canvas = document.querySelector("#unity-canvas");
  createUnityInstance(canvas, {
    dataUrl: "Build/WebGL.data.unityweb",
    frameworkUrl: "Build/WebGL.framework.js.unityweb",
    codeUrl: "Build/WebGL.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "MuseumInspect",
    productName: "Voices of Stone",
    productVersion: "1.0.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  }, function (p) {
    document.querySelector("#fill").style.width = (p * 100) + "%";
    document.querySelector("#pct").textContent = "Loading " + Math.round(p * 100) + "%";
  }).then(function () {
    document.querySelector("#loader").classList.add("done");
    canvas.focus();
  }).catch(function (e) {
    var el = document.querySelector("#err"); el.hidden = false;
    el.textContent = "This demo needs a desktop browser with WebGL 2 (Chrome, Edge or Firefox). " + e;
  });
</script>
</body>
</html>
