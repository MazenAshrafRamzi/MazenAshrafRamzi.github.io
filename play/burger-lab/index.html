<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="theme-color" content="#D81E1E">
    <title>Ziggy Burger Lab</title>
<link rel="icon" href="data:,">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #D81E1E;
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Full-window stage; the canvas is letterboxed to 16:9 inside it (bars stay Ziggy Red). */
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #D81E1E; outline: none; }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #D81E1E; color: #FFFFFF; transition: opacity .35s ease;
        font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader h1 { margin: 0; font-size: clamp(28px, 5vw, 64px); letter-spacing: -0.02em; }
      #bar { width: min(420px, 70vw); height: 14px; border-radius: 7px; background: #A51515; overflow: hidden; }
      #fill { width: 0%; height: 100%; border-radius: 7px; background: #FFFFFF; transition: width .15s linear; }
      #error {
        display: none; max-width: 80vw; padding: 12px 18px; border-radius: 10px;
        background: #FFF3E3; color: #1B1B1B; font: 16px/1.4 "Segoe UI", Arial, sans-serif; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loader">
      <h1>ZIGGY BURGER LAB</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var ASPECT = 16 / 9;
      var canvas = document.querySelector("#unity-canvas");

      // Largest 16:9 box that fits the window; re-run on resize/rotation.
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w / h > ASPECT) { w = Math.round(h * ASPECT); } else { h = Math.round(w / ASPECT); }
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", fit);
      fit();

      function showError(message) {
        var e = document.querySelector("#error");
        e.textContent = message;
        e.style.display = "block";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "your creative team",
        productName: "Ziggy Burger Lab",
        productVersion: "1.0.0",
        // Sharp on high-DPI screens, capped so integrated GPUs keep 60 fps.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") showError(msg); },
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loader").classList.add("done");
        canvas.focus();
      }).catch(function (message) {
        showError(message);
      });
    </script>
  </body>
</html>
